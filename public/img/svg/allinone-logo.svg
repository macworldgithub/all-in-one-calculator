<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 36" fill="none" width="240" height="36">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Calculator Icon Badge -->
  <rect x="2" y="2" width="32" height="32" rx="8" fill="url(#logoGrad)" />
  <!-- Screen bar -->
  <rect x="7" y="7" width="22" height="6" rx="2" fill="#ffffff" opacity="0.95" />
  <!-- Key grid dots -->
  <circle cx="10" cy="19" r="1.8" fill="#ffffff" />
  <circle cx="18" cy="19" r="1.8" fill="#ffffff" />
  <circle cx="26" cy="19" r="1.8" fill="#ffffff" />
  <circle cx="10" cy="26" r="1.8" fill="#ffffff" />
  <circle cx="18" cy="26" r="1.8" fill="#ffffff" />
  <rect x="24" y="24" width="4.5" height="4" rx="1" fill="#93c5fd" />
  <!-- Text Brand -->
  <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="-0.3">
    ALL IN ONE <tspan fill="#60a5fa" font-weight="600">CALCULATOR</tspan>
  </text>
</svg>
